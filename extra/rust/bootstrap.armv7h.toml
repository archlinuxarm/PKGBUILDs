# see src/bootstrap/defaults/
profile = "dist"

# see src/bootstrap/src/utils/change_tracker.rs
change-id = 162423

[llvm]
download-ci-llvm = false
link-shared = true

[gcc]
download-ci-gcc = false

[build]
description = "%description%"
target = [
  "armv7-unknown-linux-gnueabihf",
  "armv7-unknown-linux-musleabihf",
  "wasm32-unknown-unknown",
  "wasm32v1-none",
  "wasm32-wasip1",
  "wasm32-wasip1-threads",
  "wasm32-wasip2",
]
cargo = "/usr/bin/cargo"
rustc = "/usr/bin/rustc"
rustfmt = "/usr/bin/rustfmt"
locked-deps = true
vendor = true
tools = [
  "cargo",
  "clippy",
  "rustdoc",
  "rustfmt",
  "rust-analyzer-proc-macro-srv",
  "analysis",
  "rust-src",
  "rustc-dev",
]
sanitizers = true
profiler = true

# Generating docs fails with the wasm32-* targets
docs = false

[install]
prefix = "/usr"

[rust]
codegen-units = 16
codegen-units-std = 1
debuginfo-level = 0
debuginfo-level-std = 0
channel = "stable"
rpath = false
frame-pointers = true
lld = false
bootstrap-override-lld = "external"
llvm-bitcode-linker = false
deny-warnings = false
backtrace-on-ice = true
remap-debuginfo = false
compress-debuginfo = "off"
parallel-frontend-threads = 0

[dist]
compression-formats = ["gz"]
compression-profile = "fast"

[target.armv7-unknown-linux-gnueabihf]
llvm-config = "/usr/bin/llvm-config"

[target.armv7-unknown-linux-musleabihf]
musl-root = "/usr/lib/musl"
cc = "musl-gcc"
sanitizers = false

[target.wasm32-unknown-unknown]
cc = "clang"
cxx = "clang++"
ar = "llvm-ar"
ranlib = "llvm-ranlib"
sanitizers = false
profiler = false

[target.wasm32v1-none]
cc = "clang"
cxx = "clang++"
ar = "llvm-ar"
ranlib = "llvm-ranlib"
sanitizers = false
profiler = false

[target.wasm32-wasip1]
wasi-root = "/usr/share/wasi-sysroot"
cc = "clang"
cxx = "clang++"
ar = "llvm-ar"
ranlib = "llvm-ranlib"
sanitizers = false
profiler = false

[target.wasm32-wasip1-threads]
wasi-root = "/usr/share/wasi-sysroot"
cc = "clang"
cxx = "clang++"
ar = "llvm-ar"
ranlib = "llvm-ranlib"
sanitizers = false
profiler = false

[target.wasm32-wasip2]
wasi-root = "/usr/share/wasi-sysroot"
cc = "clang"
cxx = "clang++"
ar = "llvm-ar"
ranlib = "llvm-ranlib"
sanitizers = false
profiler = false
